[package]
name = "kvstore_plugin"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"

[lib]
crate-type = ["cdylib"]

[dependencies]
thenodes = { version = "=0.4.0", path = "../../" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "fs", "sync"] }
async-trait = "0.1"

# Forward ABI-affecting TheNodes features so the plugin can be built with the
# same feature set as its host.
[features]
noise = ["thenodes/noise"]
upnp = ["thenodes/upnp"]
