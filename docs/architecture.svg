<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img" aria-labelledby="title description">
  <title id="title">TheNodes 0.4.0 high-level architecture</title>
  <desc id="description">CAL applications and NEP plugins communicate through framework APIs, delivery semantics, connection policy, peer state, and TCP, UDP, or relay transports. Runtime components emit structured events.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#405563"/>
    </marker>
    <style>
      .title { font: 700 25px 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #17212b; }
      .subtitle { font: 400 14px 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #52606d; }
      .section { font: 700 13px 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #52606d; letter-spacing: 1px; }
      .label { font: 700 17px 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #17212b; text-anchor: middle; }
      .detail { font: 400 13px 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #40505c; text-anchor: middle; }
      .side-label { font: 700 16px 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #17212b; text-anchor: middle; }
      .side-detail { font: 400 12px 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #40505c; text-anchor: middle; }
      .box { stroke-width: 2; rx: 6; }
      .flow { fill: none; stroke: #405563; stroke-width: 2.2; marker-end: url(#arrow); }
      .both { fill: none; stroke: #405563; stroke-width: 2.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .event-flow { fill: none; stroke: #8b5a72; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .config-flow { fill: none; stroke: #39776f; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="830" fill="#f6f7f4"/>
  <text class="title" x="40" y="42">TheNodes 0.4.0 architecture</text>
  <text class="subtitle" x="40" y="67">Bidirectional message flow across application, delivery, routing, transport, and observability layers</text>

  <rect class="box" x="260" y="88" width="300" height="64" fill="#e5f3ed" stroke="#3e7f68"/>
  <text class="label" x="410" y="116">CAL application</text>
  <text class="detail" x="410" y="137">Core-as-a-Library integration</text>

  <rect class="box" x="650" y="88" width="300" height="64" fill="#fff1cc" stroke="#a57616"/>
  <text class="label" x="800" y="116">NEP plugins</text>
  <text class="detail" x="800" y="137">Runtime-loaded application logic</text>

  <rect x="170" y="178" width="850" height="510" rx="8" fill="#ffffff" stroke="#9aa8b3" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="section" x="194" y="204">THENODES RUNTIME</text>

  <rect class="box" x="245" y="222" width="330" height="68" fill="#dceef5" stroke="#39758a"/>
  <text class="label" x="410" y="251">Public API</text>
  <text class="detail" x="410" y="273">CAL lifecycle and messaging</text>

  <rect class="box" x="635" y="222" width="330" height="68" fill="#dceef5" stroke="#39758a"/>
  <text class="label" x="800" y="251">PluginContext + PluginManager</text>
  <text class="detail" x="800" y="273">Outbound API and async dispatch</text>

  <path class="both" d="M 410 152 L 410 222"/>
  <path class="both" d="M 800 152 L 800 222"/>

  <rect class="box" x="365" y="330" width="480" height="78" fill="#fde3dc" stroke="#a95847"/>
  <text class="label" x="605" y="360">Delivery runtime</text>
  <text class="detail" x="605" y="382">Reliability, acknowledgements, deduplication and ordering</text>

  <path class="both" d="M 410 290 L 410 309 L 525 330"/>
  <path class="both" d="M 800 290 L 800 309 L 685 330"/>

  <rect class="box" x="245" y="451" width="330" height="76" fill="#fff0c2" stroke="#a57616"/>
  <text class="label" x="410" y="481">Connection policy</text>
  <text class="detail" x="410" y="503">Route selection and lifecycle</text>

  <rect class="box" x="635" y="451" width="330" height="76" fill="#e9ecef" stroke="#667784"/>
  <text class="label" x="800" y="481">PeerManager + PeerStore</text>
  <text class="detail" x="800" y="503">Peers, routes, health and persistence</text>

  <path class="both" d="M 605 408 L 605 428 L 410 451"/>
  <path class="both" d="M 575 489 L 635 489"/>

  <rect class="box" x="205" y="574" width="230" height="76" fill="#e1ebf8" stroke="#4c6f9f"/>
  <text class="label" x="320" y="604">TCP</text>
  <text class="detail" x="320" y="626">TLS, Noise or plaintext</text>

  <rect class="box" x="490" y="574" width="230" height="76" fill="#dff2e6" stroke="#3e7f68"/>
  <text class="label" x="605" y="604">UDP + Noise</text>
  <text class="detail" x="605" y="626">Sessions and NAT traversal</text>

  <rect class="box" x="775" y="574" width="210" height="76" fill="#f9e7cf" stroke="#a66b28"/>
  <text class="label" x="880" y="604">Relay</text>
  <text class="detail" x="880" y="626">Store and forward</text>

  <path class="flow" d="M 410 527 L 410 548 L 320 574"/>
  <path class="flow" d="M 410 527 L 410 548 L 605 574"/>
  <path class="flow" d="M 410 527 L 410 548 L 880 574"/>

  <rect class="box" x="410" y="738" width="390" height="64" fill="#293844" stroke="#17212b"/>
  <text x="605" y="768" style="font: 700 18px 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #ffffff; text-anchor: middle;">Remote peers</text>
  <text x="605" y="789" style="font: 400 13px 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #dce5ea; text-anchor: middle;">Authenticated bidirectional network paths</text>

  <path class="both" d="M 320 650 L 320 704 L 505 738"/>
  <path class="both" d="M 605 650 L 605 738"/>
  <path class="both" d="M 880 650 L 880 704 L 705 738"/>

  <rect class="box" x="18" y="264" width="126" height="126" fill="#e0f0ec" stroke="#39776f"/>
  <text class="side-label" x="81" y="295">Config</text>
  <text class="side-detail" x="81" y="320">Realm</text>
  <text class="side-detail" x="81" y="340">PKI / trust</text>
  <text class="side-detail" x="81" y="360">Network</text>
  <text class="side-detail" x="81" y="380">Delivery</text>
  <path class="config-flow" d="M 144 327 L 214 327 L 365 350"/>
  <path class="config-flow" d="M 144 350 L 205 350 L 245 477"/>

  <rect class="box" x="1050" y="264" width="212" height="92" fill="#f3e5ec" stroke="#8b5a72"/>
  <text class="side-label" x="1156" y="297">Event dispatcher</text>
  <text class="side-detail" x="1156" y="321">Structured runtime events</text>
  <text class="side-detail" x="1156" y="340">and audit records</text>

  <rect class="box" x="1050" y="405" width="212" height="86" fill="#f7edf2" stroke="#8b5a72"/>
  <text class="side-label" x="1156" y="438">Event sinks</text>
  <text class="side-detail" x="1156" y="463">Console / JSONL / plugins</text>
  <path class="flow" d="M 1156 356 L 1156 405"/>

  <path class="event-flow" d="M 965 254 L 1028 254 L 1050 291"/>
  <path class="event-flow" d="M 845 369 L 1018 369 L 1050 329"/>
  <path class="event-flow" d="M 965 489 L 1028 489 L 1050 345"/>

  <text class="subtitle" x="184" y="674">Framework-owned runtime boundary</text>
</svg>